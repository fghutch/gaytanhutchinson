name: Comparables EDGAR

# Actualiza data/comparables-eeuu.json con financieros públicos de la SEC.
# Corre cada lunes y se puede lanzar a mano desde la pestaña Actions de GitHub.
on:
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:
  push:  # TEMPORAL: prueba en la rama
    branches: [rangos-comparables]
    paths: [scripts/comparables_edgar.py, .github/workflows/comparables-edgar.yml]

permissions:
  contents: write

concurrency:
  group: comparables-edgar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar y calcular indicadores
        run: python3 scripts/comparables_edgar.py
      - name: Guardar cambios
        run: |
          git config user.name "Francisco Gaytan Hutchinson"
          git config user.email "fghutch@gmail.com"
          git add data/comparables-eeuu.json data/sec-sic-cache.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar comparables EDGAR ($(date -u +%F))"
            git push
          fi
